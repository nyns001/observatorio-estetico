name: Actualizar datos
on:
  schedule:
    - cron: "0 5 * * 1"   # cada lunes a las 05:00 UTC
  workflow_dispatch:       # boton manual en la pestana Actions
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.5.2
        with:
          path: observatorio-estetico
      - uses: actions/setup-python@v4.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r observatorio-estetico/requirements.txt
      - name: PubMed — volumen anual y equipos citados
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python observatorio-estetico/scripts/update_pubmed.py
      - name: openFDA — dispositivos autorizados
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: python observatorio-estetico/scripts/update_devices.py
      - name: Google Trends — interes de busqueda
        continue-on-error: true   # Trends bloquea con frecuencia; no debe tumbar el resto
        run: python observatorio-estetico/scripts/update_google_trends.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd observatorio-estetico
          git add data/
          git diff --staged --quiet || git commit -m "datos: actualizacion automatica $(date -u +%Y-%m-%d)"
          git push
